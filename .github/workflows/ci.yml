# Every push runs the same builds a tag would, and keeps none of them. The
# point is that a release cannot be the first time a target is compiled: the
# ABI numbers are comptime asserts, so cross-compiling is what checks them.
name: ci

# Branches only. A tag push is the same commit CI already checked, and
# release.yml builds it again anyway.
on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: make lint
      - run: make test
      # The same command release.yml runs: every target but macOS.
      - run: make release

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: make test
      # The same command release.yml runs. On a Mac that includes macOS, which
      # is the target no other runner can build.
      - run: make release
