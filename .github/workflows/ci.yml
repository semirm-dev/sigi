# Lint and test on every push. Linux only: the code that differs by platform is
# thin, and the release workflow already proves it compiles on all three.
name: ci

on: [push, pull_request]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: X11 headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libx11-dev libxtst-dev xorg-dev

      - run: make lint
      - run: make test
