# Format, test and cross-compile on every push. Only the native platform's
# code runs in tests, so every other target has to at least compile.
name: ci

on: [push, pull_request]

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig fmt --check build.zig build.zig.zon src
      - run: zig build test --summary all
      - run: zig build -Dtarget=aarch64-linux
      - run: zig build -Dtarget=x86_64-windows

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0
      - run: zig build test --summary all
      - run: zig build
