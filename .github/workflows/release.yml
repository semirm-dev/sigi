# Builds sigi for every platform it supports.
#
# Linux and Windows are raw syscalls and Win32 externs, so they cross-compile
# from one Ubuntu runner. macOS links Apple's frameworks, and Zig only finds the
# SDK for native builds, so macOS is a native arm64 build on a macOS runner.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            make: release
          - runner: macos-latest
            make: build-osx

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The version lives in build.zig.zon; a tag that disagrees is a mistake.
      - name: Tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "\.version = \"${GITHUB_REF_NAME#v}\"" build.zig.zon

      # make owns the target list and the published names, so this workflow
      # cannot drift from what `make release` produces on a laptop. On Linux
      # that is everything except macOS; the Mac runner adds the one target
      # nothing else can build.
      - name: Build
        run: make ${{ matrix.make }}

      - name: Check the native one runs
        run: zig build -Doptimize=ReleaseSmall && ./zig-out/bin/sigi --version

      - uses: actions/upload-artifact@v7
        with:
          name: sigi-${{ matrix.runner }}
          path: bin/sigi-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum sigi-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            sigi-*
            SHA256SUMS
