# Builds sigi for every platform it supports.
#
# Linux and Windows are raw syscalls and Win32 externs, so they cross-compile
# from one Ubuntu runner. macOS links Apple's frameworks, and Zig only finds the
# SDK for native builds, so macOS is a native arm64 build on a macOS runner.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            targets: x86_64-linux aarch64-linux x86_64-windows aarch64-windows
          - runner: macos-latest
            targets: native

    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7

      - uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      # The version lives in build.zig.zon; a tag that disagrees is a mistake.
      - name: Tag matches build.zig.zon
        if: startsWith(github.ref, 'refs/tags/v')
        run: grep -q "\.version = \"${GITHUB_REF_NAME#v}\"" build.zig.zon

      - name: Build
        run: |
          for t in ${{ matrix.targets }}; do
            zig build -Doptimize=ReleaseSmall -Dtarget=$t --prefix out/$t
            # Zig target triples read <arch>-<os>. Published names are
            # <os>-<arch> using the words people recognise, which is what jq
            # and most single-binary CLIs ship, and what ghu ships. A target
            # with no name here is a mistake, not something to publish as a
            # triple.
            case $t in
              x86_64-linux)    name=linux-amd64 ;;
              aarch64-linux)   name=linux-arm64 ;;
              x86_64-windows)  name=windows-amd64 ;;
              aarch64-windows) name=windows-arm64 ;;
              native)          name=macos-arm64 ;;
              *) echo "no published name for target $t"; exit 1 ;;
            esac
            ext=""; case $t in *windows) ext=.exe ;; esac
            cp out/$t/bin/sigi$ext sigi-$name$ext
          done

      - name: Check the native one runs
        run: zig build -Doptimize=ReleaseSmall && ./zig-out/bin/sigi --version

      - uses: actions/upload-artifact@v7
        with:
          name: sigi-${{ matrix.runner }}
          path: sigi-*

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true

      - name: Checksums
        run: sha256sum sigi-* > SHA256SUMS

      - uses: softprops/action-gh-release@v3
        with:
          files: |
            sigi-*
            SHA256SUMS
